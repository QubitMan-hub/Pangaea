# Local Supabase stack. Only settings that differ from the CLI defaults are
# listed; see `npx supabase init` output or the Supabase docs for the rest.
# Production settings live in the Supabase dashboard, not here.
project_id = "pangaea"

[db]
major_version = 17

[db.seed]
enabled = false

[auth]
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000", "http://localhost:3000"]

# Production signs in with Google and GitHub only. Locally these stay off
# until you create free OAuth apps and set the env vars; meanwhile use email
# sign-in, which lands in the local Mailpit inbox and never sends real mail.
[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = true

[auth.external.github]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_GITHUB_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GITHUB_SECRET)"
