name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, typecheck, unit tests, builds
    runs-on: ubuntu-latest
    env:
      # Placeholders so env validation passes at build time; no real services
      # are contacted.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      SUPABASE_SECRET_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      # Runs `next build` itself, so there is no separate `npm run build` step.
      - name: Next.js + Cloudflare Workers build (OpenNext)
        run: npm run cf:build

  database:
    name: Migrations and database tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start Supabase (applies migrations)
        run: npx supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,realtime
      - name: Database tests (RLS and moderation invariants)
        run: npx supabase test db
      - name: Database lint
        run: npx supabase db lint --level warning --fail-on warning
      - name: Generated types are up to date
        run: |
          npx supabase gen types typescript --local > src/lib/supabase/database.types.ts
          git diff --exit-code -- src/lib/supabase/database.types.ts
