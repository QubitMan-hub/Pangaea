# CI only: GitHub's terms limit hosted runners to building, testing and deploying.
name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, typecheck, unit tests, Cloudflare build
    runs-on: ubuntu-latest
    env:
      # Placeholders so env validation passes at build time; nothing is contacted.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      SUPABASE_SECRET_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # Runs `next build` itself, then bundles for Workers.
      - run: npx opennextjs-cloudflare build

  database:
    name: Migrations, security tests, generated types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,realtime
      - run: npx supabase test db
      - run: npx supabase db lint --level warning --fail-on warning
      - name: Generated types are current
        run: npm run db:types && git diff --exit-code -- src/lib/supabase/database.types.ts
